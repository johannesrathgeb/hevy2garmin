name: Fly Deploy

on:
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Stage secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          H2G_PASSWORD: ${{ secrets.H2G_PASSWORD }}
          HEVY2GARMIN_SECRET: ${{ secrets.HEVY2GARMIN_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "H2G_PASSWORD=$H2G_PASSWORD"
            echo "HEVY2GARMIN_SECRET=$HEVY2GARMIN_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
          } | flyctl secrets import --app "$FLY_APP" --stage

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
        run: |
          flyctl deploy --app "$FLY_APP" --remote-only
