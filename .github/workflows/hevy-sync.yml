name: Hevy Auto Sync

on:
  schedule:
    - cron: "17 */1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Hevy2Garmin sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://hevy2garmin-0109.fly.dev/api/cron/sync
